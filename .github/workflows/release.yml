name: release

# Building a prebuilt binary for the GitHub Release page:
#   git tag v0.1.0 && git push origin v0.1.0
# produces link-p2p-x86_64-unknown-linux-gnu.tar.gz + SHA256SUMS as release
# assets. The tarball carries the binary AND the compiled .mo catalogs under
# locales/ (the runtime finds them next to the binary), so a downloaded
# install works in any language without a Rust toolchain or msgfmt.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install gettext (msgfmt compiles the .po catalogs)
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Build release
        run: cargo build --release
      - name: Package binary + catalogs
        run: |
          set -euo pipefail
          pkg="link-p2p-x86_64-unknown-linux-gnu"
          mkdir -p "$pkg/locales"
          cp target/release/link-p2p "$pkg/"
          # build.rs mirrors compiled .mo catalogs to target/release/locales
          # (next to the binary). Fall back to hashed OUT_DIR if missing.
          if [ -d target/release/locales ]; then
            cp -r target/release/locales/. "$pkg/locales/"
          else
            out_locales="$(ls -dt target/release/build/link-p2p-*/out/locales | head -1)"
            cp -r "$out_locales"/. "$pkg/locales/"
          fi
          test -f "$pkg/locales/zh_CN/LC_MESSAGES/link-p2p.mo"
          tar -czf "$pkg.tar.gz" "$pkg"
          sha256sum "$pkg.tar.gz" > SHA256SUMS
          ls -la "$pkg.tar.gz" SHA256SUMS
      - name: Extract changelog for this release
        id: changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Everything between "## [<version>]" and the next "## [" heading.
          body="$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && $0 ~ "^## \\[" { exit }
            flag { print }
          ' CHANGELOG.md)"
          if [ -n "$body" ]; then
            printf '%s\n' "$body" > /tmp/release-body.md
          else
            printf 'No CHANGELOG entry for %s — see CHANGELOG.md.\n' "$version" > /tmp/release-body.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            link-p2p-*.tar.gz
            SHA256SUMS
          body_path: /tmp/release-body.md
