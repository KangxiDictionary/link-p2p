[package]
name = "link-p2p"
version = "0.3.0"
edition = "2021"
description = "Minimal TCP-over-QUIC forwarder on iroh, with a point-to-point TUN mode for whole-machine IP reachability"
license = "GPL-3.0-or-later"
repository = "https://github.com/KangxiDictionary/link-p2p"
readme = "README.md"
keywords = ["p2p", "tunnel", "quic", "iroh", "vpn"]
categories = ["network-programming", "command-line-utilities"]

[dependencies]
# Pin to the 1.x line; iroh's API moved a lot before 1.0 landed, so avoid
# accidentally picking up a pre-1.0 version via a loose "*" requirement.
iroh = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# Generates shell completion scripts (`link-p2p completions fish`, etc).
# Version must track clap's major version.
clap_complete = "4"
# Must match the noq-proto line iroh locks so
# `congestion_controller_factory(Bbr3Config)` type-checks against one crate.
# Keep `default-features = false` aligned with iroh's dependency line.
noq-proto = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# i18n: build.rs compiles locales/*.po into .mo with msgfmt; the runtime
# parses the .mo itself (src/i18n.rs) so language selection works from the
# environment alone, without needing the OS to have the locale installed.
# Terminal styling (bold/color) for our own output; clap styles --help itself.
console = "0.16"
# TUN device support (TUN mode: whole-machine IP reachability, needs root).
# The `async` feature is off by default; AsyncDevice is what we drive with tokio.
tun2 = { version = "4", features = ["async"] }
# OS UI language when LANGUAGE/LANG are unset (typical on Windows).
sys-locale = "0.3"
# Address derivation for TUN mode (blake3 already in the tree via iroh).
blake3 = "1"
# QUIC datagram payload type for TUN mode.
bytes = "1"
# TCP socket buffer hints for stream forwarding.
socket2 = "0.6"
# Wipe key material (hex/bytes) from memory when loading identities.
zeroize = "1"
# Optional passphrase encryption for the identity file (--identity-passphrase
# / LINK_P2P_PASSPHRASE): Argon2id key derivation + XChaCha20-Poly1305 AEAD.
argon2 = { version = "0.6", features = ["password-hash"] }
chacha20poly1305 = "0.11"
# OS entropy for identity-file salt/nonce (argon2 0.6 no longer re-exports OsRng).
getrandom = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Exclusive lock for TUN daemon lifetime (cross-platform).
fslock = "0.2"
# Lock-free snapshot swaps for TUN peer tables (read on every packet).
arc-swap = "1"

# Unix: setsid in the TUN daemon worker (detach from controlling terminal);
# safe umask around control-socket bind (never born with broad perms).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["process", "signal", "user", "fs"] }
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_EventLog",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Memory",
] }

[[bin]]
name = "link-p2p"
path = "src/main.rs"

[lints.rust]
# Deny (not forbid) so Windows named-pipe ACL setup can use a scoped
# `#![allow(unsafe_code)]` in `win_pipe` for CreateNamedPipeW / from_raw_handle.
unsafe_code = "deny"

[lints.clippy]
# Deny buckets that catch real bugs; pedantic/nursery warn with allows for
# patterns this crate intentionally uses (clap, i18n, wire casts, select!).
# Groups need priority < individual allows so the allow-list can override.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
too_many_arguments = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# clap + i18n msgids are English prose / CLI flag names, not rustdoc links.
doc_markdown = "allow"
uninlined_format_args = "allow"
significant_drop_tightening = "allow"
significant_drop_in_scrutinee = "allow"
await_holding_lock = "allow"
future_not_send = "allow"
# Integer widths chosen for wire formats (ICMP, SOCKS5, QUIC windows).
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
trivially_copy_pass_by_ref = "allow"
redundant_pub_crate = "allow"
option_if_let_else = "allow"
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
single_match_else = "allow"
missing_const_for_fn = "allow"
format_collect = "allow"
use_self = "allow"
similar_names = "allow"
unnecessary_wraps = "allow"
items_after_statements = "allow"
return_self_not_must_use = "allow"
manual_let_else = "allow"
ignored_unit_patterns = "allow"

